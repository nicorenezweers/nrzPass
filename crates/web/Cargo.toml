[package]
name = "nrzpass-web"
description = "nrzPass Web-Tresor (Leptos CSR, Rust/UI) – auch Oberflaeche der macOS-App und des Erweiterungs-Popups"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nrzpass-core.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
zeroize.workspace = true
leptos = { version = "0.8", features = ["csr"] }
tw_merge = { version = "0.1", features = ["variant"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "HtmlAnchorElement",
  "HtmlSelectElement", "Storage", "Navigator", "Clipboard", "Location", "Headers", "Request", "RequestInit",
  "RequestMode", "Response", "KeyboardEvent", "MouseEvent", "Event", "EventTarget", "Blob", "BlobPropertyBag",
  "Url", "File", "FileList", "DomTokenList", "Performance", "VisibilityState", "MediaQueryList", "Crypto", "HtmlDocument", "RequestCredentials", "RequestCache", "RequestRedirect",
] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
