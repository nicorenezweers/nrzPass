[package]
name = "nrzpass-server"
description = "nrzPass-Server: Web-Tresor und Bitwarden/Vaultwarden-kompatible API (axum + Turso, verschluesselt)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nrzpass"
path = "src/main.rs"

[lib]
name = "nrzpass_server"
path = "src/lib.rs"

[dependencies]
nrzpass-core.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
uuid.workspace = true
zeroize.workspace = true
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors", "limit"] }
tower = "0.5"
# Turso (SQLite in Rust) mit Verschluesselung der Datenbankdatei (AEGIS-256, reines Rust)
turso = { version = "0.8.3", default-features = false, features = ["pure-rust-crypto"] }
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
