[package]
name = "nrzpass-extension"
description = "nrzPass Browser-Erweiterung: Hintergrund-Dienst und Inhaltsskript (Formularerkennung, Ausfuellen, Speichern) in Rust/WASM"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Je ein eigenes WASM: `content` (klein, in jeder Seite) und `background` (Service Worker mit Krypto).
content = []
background = []

[dependencies]
nrzpass-core.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlFormElement", "Node", "NodeList",
  "ShadowRoot", "ShadowRootInit", "ShadowRootMode", "CssStyleSheet", "DomRect", "Event", "EventInit", "EventTarget",
  "KeyboardEvent", "MouseEvent", "FocusEvent", "MutationObserver", "MutationObserverInit", "CssStyleDeclaration",
  "Location", "Request", "RequestInit", "RequestMode", "RequestCredentials", "RequestCache", "Headers", "Response",
  "HtmlCollection", "DomTokenList", "SubmitEvent",
] }
